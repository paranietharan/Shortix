services:
  db:
    image: postgres:16-alpine
    container_name: shortix-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shortix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d shortix" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortix-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./shortix-api
      dockerfile: Dockerfile
    container_name: shortix-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@db:5432/shortix?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=1b54ca0bb8017a3a639ad20632bf2b8b99b71f63
      - BASE_URL=http://localhost:8080
      - MIGRATION_RUN=true
      - SEED_ADMIN_EMAIL=admin@shortix.com
      - SEED_ADMIN_PASSWORD=Admin@12345
      - SEED_USER_EMAIL=user@shortix.com
      - SEED_USER_PASSWORD=User@12345

      - BCRYPT_COST=12
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=720h
      - EMAIL_VERIFY_OTP_TTL=10m
      - PASSWORD_RESET_OTP_TTL=10m
      - PASSWORD_RESET_TEMP_TTL=15m
      - RATE_LIMIT_WINDOW=1m
      - RATE_LIMIT_LOGIN_MAX=10
      - RATE_LIMIT_FORGOT_PASSWORD_MAX=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
